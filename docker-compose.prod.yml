# Droplet production stack: Caddy :80/:443 -> API :8080, Postgres unpublished.
# Usage (on the droplet, repo root):
#   docker compose -f docker-compose.prod.yml up -d --build
# Until DNS exists, set CADDYFILE=./deploy/Caddyfile.http (see caddy volumes below).

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: Foodiestopia
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=Foodiestopia;Username=postgres;Password=${POSTGRES_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      GMAIL_EMAIL: ${GMAIL_EMAIL}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD}
      SEED_DELETEDUSER_PASSWORD: ${SEED_DELETEDUSER_PASSWORD}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
